<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Mundial AR · Inicio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Bootstrap primero -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Tu CSS DESPUÉS de Bootstrap -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header -->
  <header class="navbar navbar-dark bg-black sticky-top shadow-sm header-has-track">
    <div class="container-fluid">
      <span class="navbar-brand d-flex align-items-center gap-2">
        <i class="bi bi-trophy-fill"></i> Mundial AR 2026
      </span>
      <div class="d-flex gap-2">
        <!-- Botón de cambio de tema -->
        <button id="themeToggle" class="btn btn-outline-light btn-sm" aria-label="Cambiar tema">
          <i class="bi bi-brightness-high-fill"></i>
        </button></div>
    </div>

    <!-- Pista + balón (animado con tu CSS) -->
    <div class="header-track" aria-hidden="true">
      <div class="soccer"></div>
    </div>
  </header>

  <!-- Hero de cancha (decorativo) -->
 <section class="ar-stage ar-hero rounded-3 mb-4" aria-hidden="true"></section>


  <!-- Contenido -->
  <main class="container py-4 mb-5">
    <section class="text-center">
      <h1 class="h3 fw-bold mb-2">Explora el Mundial en AR</h1>
      <p class="text-secondary mb-4">Escanea pósters, camisetas o QR y divertirte modelos 3D, efectos y trivias.</p>
      <a href="ar.html" class="btn btn-primary btn-lg w-100">
        <i class="bi bi-camera me-2" aria-hidden="true"></i> Escanear con AR
      </a>
    </section>

    <!-- Tiles / Acciones -->
    <section class="mt-5">
      <h2 class="h5 mb-3">Qué puedes hacer</h2>
      <div class="row g-3">
        <div class="col-6">
          <a href="trivias.html" class="card card-action h-100 text-decoration-none">
            <div class="card-body text-center">
              <i class="bi bi-patch-question fs-1 d-block mb-2" aria-hidden="true"></i>
              <span class="fw-semibold d-block">Trivias</span>
              <small class="text-secondary">Gana puntos</small>
            </div>
          </a>
        </div>

        <div class="col-6">
          <a href="paises.html" class="card card-action h-100 text-decoration-none">
            <div class="card-body text-center">
              <i class="bi bi-cube fs-1 d-block mb-2" aria-hidden="true"></i>
              <span class="fw-semibold d-block">Países</span>
              <small class="text-secondary">Información</small>
            </div>
          </a>
        </div>

        <div class="col-12">
          <a href="noticias.html" class="card card-action h-100 text-decoration-none">
            <div class="card-body d-flex align-items-center gap-3">
              <i class="bi bi-newspaper fs-2" aria-hidden="true"></i>
              <div>
                <span class="fw-semibold d-block">Noticias &amp; Sedes</span>
                <small class="text-secondary">Calendario, equipos y más</small>
              </div>
            </div>
          </a>
        </div>
      </div>
    </section>
  </main>

  <!-- Tabbar inferior -->
  <nav class="tabbar" aria-label="Navegación inferior">
    <a class="active" href="index.html"><i class="bi bi-house-door" aria-hidden="true"></i><span>Inicio</span></a>
    <a href="ar.html"><i class="bi bi-camera" aria-hidden="true"></i><span>AR</span></a>
    <a href="trivias.html"><i class="bi bi-patch-question" aria-hidden="true"></i><span>Trivias</span></a>
    <a href="paises.html"><i class="bi bi-cube" aria-hidden="true"></i><span>Países</span></a>
    <a href="noticias.html"><i class="bi bi-newspaper" aria-hidden="true"></i><span>Noticias</span></a>
  </nav>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const html = document.documentElement;
    const toggleBtn = document.getElementById("themeToggle");
    const icon = toggleBtn.querySelector("i");

    toggleBtn.addEventListener("click", () => {
      const current = html.getAttribute("data-bs-theme") || "dark";
      const next = current === "dark" ? "light" : "dark";
      html.setAttribute("data-bs-theme", next);

      // Cambia el icono
      icon.className = next === "dark"
        ? "bi bi-brightness-high-fill"
        : "bi bi-moon-fill";
    });
  </script>
</body>
</html>
