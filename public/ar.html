<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>Mundial AR · Escanear</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap + Icons (UI) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- A-Frame + MindAR -->
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body{background:#0b0d12;}
    #stage{position:relative;height:70vh}
    .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .hud{position:fixed;left:0;right:0;bottom:.75rem;z-index:20;display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem}
    .info{position:fixed;right:.75rem;top:.75rem;z-index:21;max-width:300px}
    .slider-card{position:fixed;left:.75rem;bottom:6.5rem;z-index:21;max-width:320px}
    .form-range{width:240px}
  </style>
</head>
<body>
  <header class="navbar navbar-dark bg-black sticky-top shadow-sm">
    <div class="container-fluid">
      <a class="btn btn-outline-light btn-sm" href="index.html"><i class="bi bi-arrow-left"></i></a>
      <span class="navbar-brand ms-2"><i class="bi bi-camera"></i> Escanear en AR</span>
    </div>
  </header>

  <main class="container-fluid p-0">
    <section id="stage">
      <a-scene id="scene"
        mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; filterMinCF:0.001; filterBeta:0.001"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights: true, antialias: true, preserveDrawingBuffer: true"
        vr-mode-ui="enabled:false"
        device-orientation-permission-ui="enabled:false"
        embedded
        style="width:100%;height:100%;">

        <!-- Preload de modelos -->
        <a-assets timeout="30000">
          <a-asset-item id="mdl-AR" src="./assets/models/flags/AR.glb"></a-asset-item>
          <a-asset-item id="mdl-AU" src="./assets/models/flags/AU.glb"></a-asset-item>
          <a-asset-item id="mdl-BR" src="./assets/models/flags/BR.glb"></a-asset-item>
          <a-asset-item id="mdl-CA" src="./assets/models/flags/CA.glb"></a-asset-item>
          <a-asset-item id="mdl-KR" src="./assets/models/flags/KR.glb"></a-asset-item>
          <a-asset-item id="mdl-EC" src="./assets/models/flags/EC.glb"></a-asset-item>
          <a-asset-item id="mdl-US" src="./assets/models/flags/US.glb"></a-asset-item>
          <a-asset-item id="mdl-IR" src="./assets/models/flags/IR.glb"></a-asset-item>
          <a-asset-item id="mdl-JP" src="./assets/models/flags/JP.glb"></a-asset-item>
          <a-asset-item id="mdl-JO" src="./assets/models/flags/JO.glb"></a-asset-item>
          <a-asset-item id="mdl-MX" src="./assets/models/flags/MX.glb"></a-asset-item>
          <a-asset-item id="mdl-NZ" src="./assets/models/flags/NZ.glb"></a-asset-item>
          <a-asset-item id="mdl-UZ" src="./assets/models/flags/UZ.glb"></a-asset-item>
        </a-assets>

        <!-- Luces -->
        <a-entity light="type: ambient; intensity: 1"></a-entity>
        <a-entity light="type: directional; intensity: .95" position="1 1 0"></a-entity>

        <!-- Cámara -->
        <a-camera look-controls="enabled:false"></a-camera>
      </a-scene>

      <!-- Overlay -->
      <div id="overlay" class="overlay">
        <div class="bg-dark text-light rounded-3 px-3 py-2 shadow">
          <p class="mb-1">Apunta a una bandera.</p>
          <small class="text-secondary">Permite la cámara. Usa HTTPS o localhost.</small>
        </div>
      </div>
    </section>

    <!-- Ficha ARRIBA -->
    <div id="card" class="info card bg-dark text-light d-none">
      <div class="card-body p-3">
        <h6 id="nm" class="card-title mb-1">—</h6>
        <p id="desc" class="card-text small mb-0">—</p>
      </div>
    </div>

    <!-- Slider tamaño + Recentrar -->
    <div class="slider-card card bg-dark text-light">
      <div class="card-body py-2 px-3">
        <label for="sizeRange" class="form-label mb-1">Tamaño modelo: <strong><span id="sizeVal">0.80</span></strong></label>
        <div class="d-flex align-items-center gap-2">
          <input id="sizeRange" type="range" class="form-range" min="0.2" max="1.5" step="0.05" value="0.8">
          <button id="btnRefit" class="btn btn-sm btn-outline-light">Recentrar</button>
        </div>
      </div>
    </div>

    <!-- Controles -->
    <div class="hud">
      <button id="btnStart" class="btn btn-primary" disabled>
        <i class="bi bi-camera-video"></i> Activar cámara
      </button>
      <button id="btnSpin" class="btn btn-outline-light" disabled>
        <i class="bi bi-pause-circle"></i> Pausar rotación
      </button>
    </div>
  </main>

  <script>
    // ===== Config =====
    const USE_MODELS = true;                      // usar GLB
    const FIT = { size: 0.8, mode: "center"};     // centrado sobre la imagen
    const SAFE_OFFSET = 2.0;                      // clamp de offsets para no "perder" el modelo
    const SCALE_MIN = 0.02, SCALE_MAX = 10;       // límites anti-locura

    const MODEL_IDS = {
      AR:"#mdl-AR", AU:"#mdl-AU", BR:"#mdl-BR", CA:"#mdl-CA", KR:"#mdl-KR",
      EC:"#mdl-EC", US:"#mdl-US", IR:"#mdl-IR", JP:"#mdl-JP", JO:"#mdl-JO",
      MX:"#mdl-MX", NZ:"#mdl-NZ", UZ:"#mdl-UZ"
    };

    // 32 índices → 13 países
    const INDEX_TO_CODE = [
      "AR","AR","AU","AU","AU","AU","BR","BR","CA","CA","KR","KR",
      "EC","EC","US","US","IR","IR","JP","JP","JO","JO","MX","MX","MX",
      "NZ","NZ","NZ","NZ","NZ","UZ","UZ"
    ];

    const META = {
      AR:{name:"Argentina", info:"Capital: Buenos Aires."},
      AU:{name:"Australia", info:"Capital: Canberra."},
      BR:{name:"Brasil", info:"Pentacampeón mundial."},
      CA:{name:"Canadá", info:"Co-anfitrión 2026."},
      KR:{name:"Corea del Sur", info:"Capital: Seúl."},
      EC:{name:"Ecuador", info:"Debut en 2002."},
      US:{name:"Estados Unidos", info:"Co-anfitrión 2026."},
      IR:{name:"Irán", info:"Capital: Teherán."},
      JP:{name:"Japón", info:"Capital: Tokio."},
      JO:{name:"Jordania", info:"Capital: Amán."},
      MX:{name:"México", info:"Co-anfitrión 2026."},
      NZ:{name:"Nueva Zelanda", info:"Capital: Wellington."},
      UZ:{name:"Uzbekistán", info:"Capital: Taskent."}
    };

    const COLORS = { // placeholder si el GLB falla
      AR:"#53b3ff", AU:"#3ec4a7", BR:"#1cc94d", CA:"#ff4d57", KR:"#e1e1e1",
      EC:"#ffe24d", US:"#6c9dff", IR:"#3fd870", JP:"#ffffff", JO:"#ff7a7a",
      MX:"#22aa66", NZ:"#2c3ee8", UZ:"#1fc9c9"
    };

    // --- Estado/UI ---
    const scene   = document.getElementById("scene");
    const overlay = document.getElementById("overlay");
    const btnStart= document.getElementById("btnStart");
    const btnSpin = document.getElementById("btnSpin");
    const infoCard= document.getElementById("card");
    const nm      = document.getElementById("nm");
    const desc    = document.getElementById("desc");
    const sizeRange = document.getElementById("sizeRange");
    const sizeVal   = document.getElementById("sizeVal");
    const btnRefit  = document.getElementById("btnRefit");

    let current = null;          // wrapper rotatorio activo
    let spinning = true;         // empezamos girando al detectar
    let arSystem = null;

    // Guardamos medidas por modelo para re-aplicar el fit con el slider
    const autoFitStore = new WeakMap(); // entity -> { maxDim, center, min }

    // === Helpers ===
    function makePlaceholder(color){
      const box = document.createElement("a-box");
      box.setAttribute("depth",".35");
      box.setAttribute("width",".7");
      box.setAttribute("height",".7");
      box.setAttribute("position","0 0 0");
      box.setAttribute("color", color || "#7aa7ff");
      return box;
    }

    function setSpin(active){
      spinning = !!active;
      if (current){
        const comp = current.components["animation__spin"];
        if (comp){ spinning ? comp.play() : comp.pause(); }
      }
      btnSpin.innerHTML = spinning
        ? '<i class="bi bi-pause-circle"></i> Pausar rotación'
        : '<i class="bi bi-arrow-repeat"></i> Activar rotación';
    }

    function makeRotWrapper(){
      const wrapper = document.createElement("a-entity");
      wrapper.classList.add("rot");
      wrapper.setAttribute("position","0 0 0");
      wrapper.setAttribute("animation__spin","property: rotation; to: 0 360 0; loop: true; dur: 2000; easing: linear; autoplay: true");
      return wrapper;
    }

    function computeBounds(model){ // THREE.Object3D
      const THREE = AFRAME.THREE;
      model.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(model);
      const size = new THREE.Vector3(); box.getSize(size);
      const center = new THREE.Vector3(); box.getCenter(center);
      const maxDim = Math.max(size.x, size.y, size.z);
      return { maxDim: isFinite(maxDim) && maxDim > 0 ? maxDim : 1, center, min: box.min.clone() };
    }

    function clamp(v, min, max){ return Math.min(Math.max(v, min), max); }

    function applyFit(entity, storeObj, {size=0.8, mode="center"} = {}){
      if (!storeObj || !storeObj.maxDim) return;

      // --- ESCALA UNIFORME SEGURA ---
      let scale = size / storeObj.maxDim;
      scale = clamp(scale, SCALE_MIN, SCALE_MAX);
      entity.object3D.scale.setScalar(scale);

      // --- OFFSET CENTRADO / PISO (CLAMP PARA NO "SALIRSE") ---
      const THREE = AFRAME.THREE;
      let off = new THREE.Vector3(-storeObj.center.x, -storeObj.center.y, -storeObj.center.z);
      if (mode === "floor") off.y = -storeObj.min.y;

      off.multiplyScalar(scale);
      off.x = clamp(off.x, -SAFE_OFFSET, SAFE_OFFSET);
      off.y = clamp(off.y, -SAFE_OFFSET, SAFE_OFFSET);
      off.z = clamp(off.z, -SAFE_OFFSET, SAFE_OFFSET);

      entity.object3D.position.set(off.x, off.y, off.z);
      entity.object3D.updateMatrixWorld();
    }

    function buildAnchors(){
      INDEX_TO_CODE.forEach((code, idx) => {
        const anchor = document.createElement("a-entity");
        anchor.setAttribute("mindar-image-target", `targetIndex: ${idx}`);

        const rot = makeRotWrapper();
        let content;

        if (USE_MODELS) {
          content = document.createElement("a-entity");
          const src = MODEL_IDS[code] || "";
          if (!src){
            content = makePlaceholder(COLORS[code]);
          } else {
            // ⬇️ GLTF con decoders para DRACO / Meshopt / KTX2
            content.setAttribute("gltf-model", {
              src: src,
              dracoDecoderPath: "https://www.gstatic.com/draco/v1/decoders/",
              meshoptDecoderPath: "https://unpkg.com/meshoptimizer/meshopt_decoder.js",
              ktx2TranscoderPath: "https://unpkg.com/ktx2decoders/bin/"
            });

            content.addEventListener("model-loaded", (e)=>{
              const model = e.detail.model;
              if (!model) return;
              // Recalcular después de 2 frames para jerarquía estable
              requestAnimationFrame(()=>requestAnimationFrame(()=>{
                const data = computeBounds(model);
                autoFitStore.set(content, data);
                applyFit(content, data, FIT);
              }));
            });

            content.addEventListener("model-error", (ev)=>{
              console.error("Error GLB", code, ev.detail);
              const ph = makePlaceholder(COLORS[code]);
              rot.removeChild(content);
              rot.appendChild(ph);
            });
          }
        } else {
          content = makePlaceholder(COLORS[code]);
        }

        rot.appendChild(content);
        anchor.appendChild(rot);

        anchor.addEventListener("targetFound", ()=>{
          overlay.style.display = "none";
          current = rot;
          setSpin(true);
          btnSpin.disabled = false;

          const m = META[code] || {name: code, info:"—"};
          nm.textContent = m.name;
          desc.textContent = m.info;
          infoCard.classList.remove("d-none");
        });

        anchor.addEventListener("targetLost", ()=>{
          setSpin(false);
          btnSpin.disabled = true;
          current = null;
        });

        scene.appendChild(anchor);
      });
    }

    // Escena lista
    if (scene.hasLoaded) onSceneLoaded(); else scene.addEventListener("loaded", onSceneLoaded);
    function onSceneLoaded(){
      buildAnchors();
      arSystem = scene.systems && scene.systems["mindar-image-system"];
      if (arSystem && typeof arSystem.start === "function") btnStart.disabled = false;
      console.log("MindAR listo:", !!arSystem);
    }

    // Botones
    btnStart.addEventListener("click", async ()=>{
      try{
        if (!arSystem || typeof arSystem.start !== "function"){
          alert("MindAR no cargó. Verifica el script y el atributo mindar-image.");
          return;
        }
        await arSystem.start();
        overlay.style.display = "none";
      }catch(e){
        console.error(e);
        alert("No se pudo iniciar la cámara.\n" + (e && e.message ? e.message : e));
      }
    });
    btnSpin.addEventListener("click", ()=> setSpin(!spinning));

    // Slider tamaño en vivo + Recentrar
    sizeRange.addEventListener("input", ()=>{
      FIT.size = parseFloat(sizeRange.value);
      sizeVal.textContent = FIT.size.toFixed(2);
      document.querySelectorAll('[gltf-model]').forEach(ent=>{
        const data = autoFitStore.get(ent);
        if (data) applyFit(ent, data, FIT);
      });
    });
    btnRefit.addEventListener("click", ()=>{
      document.querySelectorAll('[gltf-model]').forEach(ent=>{
        const data = autoFitStore.get(ent);
        if (data) applyFit(ent, data, FIT);
      });
    });

    // HTTPS tip
    if (location.protocol !== "https:" && location.hostname !== "localhost"){
      console.warn("Para móvil, usa HTTPS o localhost.");
    }
  </script>
</body>
</html>
