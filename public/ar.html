<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>Mundial AR · Escanear</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap + Icons (UI) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- A-Frame + MindAR (A-Frame primero) -->
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body{background:#0b0d12;}
    #stage{position:relative;height:70vh}
    .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .hud{position:fixed;left:0;right:0;bottom:.75rem;z-index:20;display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem}

    :root{ --navbar-h: 56px; }
    .info{
      position:fixed;
      right:.75rem;
      top: calc(env(safe-area-inset-top, 0px) + var(--navbar-h) + 12px);
      z-index:21;
      max-width:300px;
    }
  </style>
</head>
<body>
  <header class="navbar navbar-dark bg-black sticky-top shadow-sm">
    <div class="container-fluid">
      <a class="btn btn-outline-light btn-sm" href="index.html"><i class="bi bi-arrow-left"></i></a>
      <span class="navbar-brand ms-2"><i class="bi bi-camera"></i> Escanear en AR</span>
    </div>
  </header>

  <main class="container-fluid p-0">
    <section id="stage">
      <a-scene id="scene"
        mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; filterMinCF:0.001; filterBeta:0.001"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights: true, antialias: true, preserveDrawingBuffer: true"
        vr-mode-ui="enabled:false"
        device-orientation-permission-ui="enabled:false"
        embedded
        style="width:100%;height:100%;">

        <!-- Preload de modelos (sube tus GLB a public/assets/models/flags/) -->
        <a-assets timeout="30000">
          <a-asset-item id="mdl-AR" src="./assets/models/flags/AR.glb"></a-asset-item>
          <a-asset-item id="mdl-AU" src="./assets/models/flags/AU.glb"></a-asset-item>
          <a-asset-item id="mdl-BR" src="./assets/models/flags/BR.glb"></a-asset-item>
          <a-asset-item id="mdl-CA" src="./assets/models/flags/CA.glb"></a-asset-item>
          <a-asset-item id="mdl-KR" src="./assets/models/flags/KR.glb"></a-asset-item>
          <a-asset-item id="mdl-EC" src="./assets/models/flags/EC.glb"></a-asset-item>
          <a-asset-item id="mdl-US" src="./assets/models/flags/US.glb"></a-asset-item>
          <a-asset-item id="mdl-IR" src="./assets/models/flags/IR.glb"></a-asset-item>
          <a-asset-item id="mdl-JP" src="./assets/models/flags/JP.glb"></a-asset-item>
          <a-asset-item id="mdl-JO" src="./assets/models/flags/JO.glb"></a-asset-item>
          <a-asset-item id="mdl-MX" src="./assets/models/flags/MX.glb"></a-asset-item>
          <a-asset-item id="mdl-NZ" src="./assets/models/flags/NZ.glb"></a-asset-item>
          <a-asset-item id="mdl-UZ" src="./assets/models/flags/UZ.glb"></a-asset-item>
        </a-assets>

        <!-- Luces -->
        <a-entity light="type: ambient; intensity: 1"></a-entity>
        <a-entity light="type: directional; intensity: .9" position="1 1 0"></a-entity>

        <!-- Cámara -->
        <a-camera look-controls="enabled:false"></a-camera>
      </a-scene>

      <!-- Overlay -->
      <div id="overlay" class="overlay">
        <div class="bg-dark text-light rounded-3 px-3 py-2 shadow">
          <p class="mb-1">Apunta a una bandera.</p>
          <small class="text-secondary">Permite la cámara. Usa HTTPS o localhost.</small>
        </div>
      </div>
    </section>

    <!-- Tarjeta de info -->
    <div id="card" class="info card bg-dark text-light d-none">
      <div class="card-body p-3">
        <h6 id="nm" class="card-title mb-1">—</h6>
        <p id="desc" class="card-text small mb-0">—</p>
      </div>
    </div>

    <!-- Controles -->
    <div class="hud">
      <button id="btnStart" class="btn btn-primary" disabled>
        <i class="bi bi-camera-video"></i> Activar cámara
      </button>
      <button id="btnSpin" class="btn btn-outline-light" disabled>
        <i class="bi bi-arrow-repeat"></i> Activar rotación
      </button>
    </div>
  </main>

  <script>
    // --- Config ---
    const USE_MODELS = false; // ⬅️ ponlo en true cuando ya subas tus GLB a /public/assets/models/flags/
    const MODEL_IDS = { AR:"#mdl-AR", AU:"#mdl-AU", BR:"#mdl-BR", CA:"#mdl-CA", KR:"#mdl-KR",
                        EC:"#mdl-EC", US:"#mdl-US", IR:"#mdl-IR", JP:"#mdl-JP", JO:"#mdl-JO",
                        MX:"#mdl-MX", NZ:"#mdl-NZ", UZ:"#mdl-UZ" };

    // Mapeo 32 índices → 13 países (tus rangos)
    const INDEX_TO_CODE = [
      "AR","AR",
      "AU","AU","AU","AU",
      "BR","BR",
      "CA","CA",
      "KR","KR",
      "EC","EC",
      "US","US",
      "IR","IR",
      "JP","JP",
      "JO","JO",
      "MX","MX","MX",
      "NZ","NZ","NZ","NZ","NZ",
      "UZ","UZ"
    ];

    // Meta por país
    const META = {
      AR:{name:"Argentina", info:"Capital: Buenos Aires."},
      AU:{name:"Australia", info:"Capital: Canberra."},
      BR:{name:"Brasil", info:"Pentacampeón mundial."},
      CA:{name:"Canadá", info:"Co-anfitrión 2026."},
      KR:{name:"Corea del Sur", info:"Capital: Seúl."},
      EC:{name:"Ecuador", info:"Debut en 2002."},
      US:{name:"Estados Unidos", info:"Co-anfitrión 2026."},
      IR:{name:"Irán", info:"Capital: Teherán."},
      JP:{name:"Japón", info:"Capital: Tokio."},
      JO:{name:"Jordania", info:"Capital: Amán."},
      MX:{name:"México", info:"Co-anfitrión 2026."},
      NZ:{name:"Nueva Zelanda", info:"Capital: Wellington."},
      UZ:{name:"Uzbekistán", info:"Capital: Taskent."}
    };

    // Colores de cubos (placeholder)
    const COLORS = {
      AR:"#53b3ff", AU:"#3ec4a7", BR:"#1cc94d", CA:"#ff4d57", KR:"#e1e1e1",
      EC:"#ffe24d", US:"#6c9dff", IR:"#3fd870", JP:"#ffffff", JO:"#ff7a7a",
      MX:"#22aa66", NZ:"#2c3ee8", UZ:"#1fc9c9"
    };

    const scene   = document.getElementById("scene");
    const overlay = document.getElementById("overlay");
    const btnStart= document.getElementById("btnStart");
    const btnSpin = document.getElementById("btnSpin");
    const infoCard= document.getElementById("card");
    const nm      = document.getElementById("nm");
    const desc    = document.getElementById("desc");

    let current = null;   // nodo rotatable actual (wrapper)
    let spinning = false; // estado de animación
    let arSystem = null;

    function setSpin(active){
      spinning = !!active;
      if (current){
        const comp = current.components["animation__spin"];
        if (comp){ spinning ? comp.play() : comp.pause(); }
      }
      btnSpin.innerHTML = spinning
        ? '<i class="bi bi-pause-circle"></i> Pausar rotación'
        : '<i class="bi bi-arrow-repeat"></i> Activar rotación';
    }

    function makeRotatingWrapper(){
      const wrapper = document.createElement("a-entity");
      wrapper.classList.add("rot");
      wrapper.setAttribute("position","0 0 0");
      wrapper.setAttribute(
        "animation__spin",
        "property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear; autoplay: false"
      );
      return wrapper;
    }

    function buildAnchors(){
      INDEX_TO_CODE.forEach((code, idx) => {
        const anchor = document.createElement("a-entity");
        anchor.setAttribute("mindar-image-target", `targetIndex: ${idx}`);

        const rot = makeRotatingWrapper();
        let content;

        if (USE_MODELS) {
          content = document.createElement("a-entity");
          content.setAttribute("gltf-model", MODEL_IDS[code] || "");
          content.setAttribute("scale", "0.42 0.42 0.42");
          content.setAttribute("position", "0 0 0.0");
          // content.setAttribute("animation-mixer", "");
        } else {
          content = document.createElement("a-box");
          content.setAttribute("depth",".35");
          content.setAttribute("width",".7");
          content.setAttribute("height",".7");
          content.setAttribute("position","0 0 0");
          content.setAttribute("color", COLORS[code] || "#7aa7ff");
        }

        rot.appendChild(content);
        anchor.appendChild(rot);

        anchor.addEventListener("targetFound", ()=>{
          overlay.style.display = "none";
          current = rot;
          setSpin(true);
          btnSpin.disabled = false;

          const m = META[code] || {name: code, info:"—"};
          nm.textContent = m.name;
          desc.textContent = m.info;
          infoCard.classList.remove("d-none");
        });

        anchor.addEventListener("targetLost", ()=>{
          setSpin(false);
          btnSpin.disabled = true;
          current = null;
        });

        scene.appendChild(anchor);
      });
    }

    if (scene.hasLoaded) onSceneLoaded(); else scene.addEventListener("loaded", onSceneLoaded);

    function onSceneLoaded(){
      buildAnchors();
      arSystem = scene.systems && scene.systems["mindar-image-system"];
      console.log("MindAR listo:", !!arSystem);
      if (arSystem && typeof arSystem.start === "function") btnStart.disabled = false;
    }

    btnStart.addEventListener("click", async ()=>{
      try{
        if (!arSystem || typeof arSystem.start !== "function"){
          alert("MindAR no cargó. Revisa el script y el atributo mindar-image.");
          return;
        }
        await arSystem.start();
        overlay.style.display = "none";
      }catch(e){
        console.error(e);
        alert("No se pudo iniciar la cámara.\n" + (e && e.message ? e.message : e));
      }
    });

    btnSpin.addEventListener("click", ()=> setSpin(!spinning));

    if (location.protocol !== "https:" && location.hostname !== "localhost"){
      console.warn("Para móvil, usa HTTPS o localhost.");
    }
  </script>
</body>
</html>
