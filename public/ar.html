<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>Mundial AR · Escanear</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap + Icons (UI) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- A-Frame + MindAR (A-Frame primero) -->
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <!-- Usa el paquete 'mind-ar' (con guion). Versión mayor 1 para mayor compatibilidad. -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body{background:#0b0d12;}
    #stage{position:relative;height:70vh}
    .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .hud{position:fixed;left:0;right:0;bottom:.75rem;z-index:20;display:flex;justify-content:center;gap:.5rem}
    .info{position:fixed;right:.75rem;bottom:4.5rem;z-index:21;max-width:280px}
  </style>
</head>
<body>
  <header class="navbar navbar-dark bg-black sticky-top shadow-sm">
    <div class="container-fluid">
      <a class="btn btn-outline-light btn-sm" href="index.html"><i class="bi bi-arrow-left"></i></a>
      <span class="navbar-brand ms-2"><i class="bi bi-camera"></i> Escanear en AR</span>
    </div>
  </header>

  <main class="container-fluid p-0">
    <section id="stage">
      <!-- OJO: 'targets.mind' está en la MISMA carpeta (public/) que este ar.html -->
      <a-scene id="scene"
        mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; filterMinCF:0.001; filterBeta:0.001"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights: true, antialias: true, preserveDrawingBuffer: true"
        vr-mode-ui="enabled:false"
        device-orientation-permission-ui="enabled:false"
        embedded
        style="width:100%;height:100%;">

        <!-- Luces -->
        <a-entity light="type: ambient; intensity: 1"></a-entity>
        <a-entity light="type: directional; intensity: .8" position="1 1 0"></a-entity>

        <!-- Cámara -->
        <a-camera look-controls="enabled:false"></a-camera>
      </a-scene>

      <!-- Overlay -->
      <div id="overlay" class="overlay">
        <div class="bg-dark text-light rounded-3 px-3 py-2 shadow">
          <p class="mb-1">Apunta a una bandera.</p>
          <small class="text-secondary">Permite la cámara. Usa HTTPS o localhost.</small>
        </div>
      </div>
    </section>

    <!-- Tarjeta de info -->
    <div id="card" class="info card bg-dark text-light d-none">
      <div class="card-body p-3">
        <h6 id="nm" class="card-title mb-1">—</h6>
        <p id="desc" class="card-text small mb-0">—</p>
      </div>
    </div>

    <!-- Controles -->
    <div class="hud">
      <button id="btnStart" class="btn btn-primary" disabled>
        <i class="bi bi-camera-video"></i> Activar cámara
      </button>
      <button id="btnSpin" class="btn btn-outline-light" disabled>
        <i class="bi bi-arrow-repeat"></i> Activar rotación
      </button>
    </div>
  </main>

  <script>
    // ================================
    // Mapeo 0-based de 32 índices
    // (1-2 AR, 3-6 AU, 7-8 BR, 9-10 CA, 11-12 KR,
    //  13-14 EC, 15-16 US, 17-18 IR, 19-20 JP, 21-22 JO,
    //  23-25 MX, 26-30 NZ, 31-32 UZ)
    // ================================
    const INDEX_TO_CODE = [
      "AR","AR",
      "AU","AU","AU","AU",
      "BR","BR",
      "CA","CA",
      "KR","KR",
      "EC","EC",
      "US","US",
      "IR","IR",
      "JP","JP",
      "JO","JO",
      "MX","MX","MX",
      "NZ","NZ","NZ","NZ","NZ",
      "UZ","UZ"
    ];

    // Meta por país (texto básico)
    const META = {
      AR:{name:"Argentina", info:"Capital: Buenos Aires."},
      AU:{name:"Australia", info:"Capital: Canberra."},
      BR:{name:"Brasil", info:"Pentacampeón mundial."},
      CA:{name:"Canadá", info:"Co-anfitrión 2026."},
      KR:{name:"Corea del Sur", info:"Capital: Seúl."},
      EC:{name:"Ecuador", info:"Debut en 2002."},
      US:{name:"Estados Unidos", info:"Co-anfitrión 2026."},
      IR:{name:"Irán", info:"Capital: Teherán."},
      JP:{name:"Japón", info:"Capital: Tokio."},
      JO:{name:"Jordania", info:"Capital: Amán."},
      MX:{name:"México", info:"Co-anfitrión 2026."},
      NZ:{name:"Nueva Zelanda", info:"Capital: Wellington."},
      UZ:{name:"Uzbekistán", info:"Capital: Taskent."}
    };

    // Colores para diferenciar placeholders
    const COLORS = {
      AR:"#53b3ff", AU:"#3ec4a7", BR:"#1cc94d", CA:"#ff4d57", KR:"#e1e1e1",
      EC:"#ffe24d", US:"#6c9dff", IR:"#3fd870", JP:"#ffffff", JO:"#ff7a7a",
      MX:"#22aa66", NZ:"#2c3ee8", UZ:"#1fc9c9"
    };

    const scene   = document.getElementById("scene");
    const overlay = document.getElementById("overlay");
    const btnStart= document.getElementById("btnStart");
    const btnSpin = document.getElementById("btnSpin");
    const infoCard= document.getElementById("card");
    const nm      = document.getElementById("nm");
    const desc    = document.getElementById("desc");

    let current = null;      // nodo .rot actual
    let spinning = false;    // estado de animación
    let arSystem = null;     // se asigna cuando A-Frame termina de cargar

    function setSpin(active){
      spinning = !!active;
      if (current){
        const comp = current.components["animation__spin"];
        if (comp){ spinning ? comp.play() : comp.pause(); }
      }
      btnSpin.innerHTML = spinning
        ? '<i class="bi bi-pause-circle"></i> Pausar rotación'
        : '<i class="bi bi-arrow-repeat"></i> Activar rotación';
    }

    function buildAnchors(){
      INDEX_TO_CODE.forEach((code, idx) => {
        const anchor = document.createElement("a-entity");
        anchor.setAttribute("mindar-image-target", `targetIndex: ${idx}`);

        const box = document.createElement("a-box");
        box.classList.add("rot");
        box.setAttribute("depth",".3");
        box.setAttribute("width",".6");
        box.setAttribute("height",".6");
        box.setAttribute("position","0 0 0");
        box.setAttribute("color", COLORS[code] || "#7aa7ff");
        box.setAttribute("animation__spin","property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear; autoplay: false");

        anchor.appendChild(box);

        anchor.addEventListener("targetFound", ()=>{
          overlay.style.display = "none";
          current = box;
          setSpin(false);
          btnSpin.disabled = false;

          const m = META[code] || {name: code, info:"—"};
          nm.textContent = m.name;
          desc.textContent = m.info;
          infoCard.classList.remove("d-none");
        });

        anchor.addEventListener("targetLost", ()=>{
          setSpin(false);
          btnSpin.disabled = true;
          current = null;
        });

        scene.appendChild(anchor);
      });
    }

    // Espera a que A-Frame termine de cargar la escena y los sistemas
    if (scene.hasLoaded) {
      onSceneLoaded();
    } else {
      scene.addEventListener("loaded", onSceneLoaded);
    }

    function onSceneLoaded(){
      // Construye anchors una vez que la escena está lista
      buildAnchors();

      // Obtén el sistema MindAR de forma segura
      arSystem = scene.systems && scene.systems["mindar-image-system"];
      console.log("MindAR listo:", !!arSystem);

      // Habilita el botón de cámara solo si el sistema está listo
      if (arSystem && typeof arSystem.start === "function") {
        btnStart.disabled = false;
      } else {
        console.warn("MindAR no inicializó. Revisa el <script> de mind-ar o el atributo mindar-image en <a-scene>.");
      }
    }

    // Botones
    btnStart.addEventListener("click", async ()=>{
      try{
        if (!arSystem || typeof arSystem.start !== "function"){
          alert("MindAR no cargó. Verifica el script y que <a-scene> tenga mindar-image.");
          return;
        }
        await arSystem.start();
        overlay.style.display = "none";
      }catch(e){
        console.error(e);
        alert("No se pudo iniciar la cámara.\n" + (e && e.message ? e.message : e));
      }
    });

    btnSpin.addEventListener("click", ()=> setSpin(!spinning));

    // Recomendación móvil: HTTPS o localhost
    if (location.protocol !== "https:" && location.hostname !== "localhost"){
      console.warn("Para móvil, sirve la página por HTTPS (o prueba en localhost).");
    }
  </script>
</body>
</html>
