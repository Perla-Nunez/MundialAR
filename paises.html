<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Mundial AR · Países participantes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap & Icons (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Tu CSS global -->
  <link rel="stylesheet" href="styles.css">

  <style>
    :root{
      --bg-grad: radial-gradient(1200px 600px at 10% -10%, rgba(0,255,200,.08), transparent 40%),
                 radial-gradient(900px 600px at 110% -20%, rgba(120,0,255,.08), transparent 45%),
                 linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.35));
      --card-bg: rgba(255,255,255,.04);
      --card-bd: rgba(255,255,255,.10);
    }
    body{ background:#0b0d12; background-image:var(--bg-grad); }

    .bg-dark-hero .topbar{ background:rgba(0,0,0,.35); backdrop-filter:blur(6px); }
    .navbar-brand{ font-weight:700; letter-spacing:.2px; }

    .wc-search{ background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15); }
    .wc-chip{ border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.04); }
    .wc-chip.active{ background:rgba(0,255,200,.12); border-color:rgba(0,255,200,.35); }

    .flag-card{
      background:var(--card-bg);
      border:1px solid var(--card-bd);
      border-radius:18px;
      transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .flag-card:hover{
      transform:translateY(-4px);
      box-shadow:0 14px 28px rgba(0,0,0,.35);
      border-color:rgba(0,255,200,.25);
    }

    .flag-emoji{ line-height:1; display:flex; align-items:center; justify-content:center; }
    .flag-emoji img{ width:44px; height:44px; display:block; } /* Twemoji SVG */

    .flag-name{ font-weight:700; }
    .badge-status{ font-weight:600; }
    .badge-host{ background:rgba(255,215,0,.12); color:#ffd700; border:1px solid rgba(255,215,0,.4); }
    .badge-qualified{ background:rgba(0,255,160,.12); color:#0bd18a; border:1px solid rgba(0,255,160,.35); }
    .badge-pending{ background:rgba(255,255,255,.08); color:#cbd5e1; border:1px solid rgba(255,255,255,.18); }

    .badge-confed{ border:1px solid transparent; }
    .c-afc{ background:rgba(255,170,0,.12); color:#ffb23a; border-color:rgba(255,170,0,.35); }
    .c-caf{ background:rgba(40,200,90,.12); color:#43d17a; border-color:rgba(40,200,90,.35); }
    .c-concacaf{ background:rgba(0,200,255,.12); color:#66d9ff; border-color:rgba(0,200,255,.35); }
    .c-conmebol{ background:rgba(115,120,255,.12); color:#9aa0ff; border-color:rgba(115,120,255,.35); }
    .c-uefa{ background:rgba(80,140,255,.12); color:#88b0ff; border-color:rgba(80,140,255,.35); }
    .c-ofc{ background:rgba(0,255,200,.12); color:#66ffd9; border-color:rgba(0,255,200,.35); }

    .tabbar{
      position:sticky; bottom:0; left:0; right:0;
      display:flex; gap:10px; justify-content:space-between;
      background:rgba(0,0,0,.5); backdrop-filter:blur(10px);
      border-top:1px solid rgba(255,255,255,.08);
      padding:.4rem .75rem;
    }
    .tabbar a{ color:#cbd5e1; text-decoration:none; display:flex; flex-direction:column; align-items:center; font-size:.8rem; }
    .tabbar i{ font-size:1.25rem; }

    .result-count{ opacity:.8; }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="sticky-top bg-dark-hero">
    <div class="topbar d-flex align-items-center justify-content-between px-3 py-2 border-bottom border-success-subtle">
      <a class="btn btn-outline-light btn-sm" href="index.html" aria-label="Regresar">
        <i class="bi bi-arrow-left"></i>
      </a>
      <span class="navbar-brand ms-2">Países participantes</span>
      <span></span>
    </div>
  </header>

  <main class="container py-4">
    <div class="row gy-3 align-items-center">
      <div class="col-12 col-lg-6">
        <p class="mb-0 text-secondary">
          Explora las selecciones con búsqueda en tiempo real, filtros y badges.
          <br class="d-none d-md-inline">
          <small class="text-body-secondary">Tip: escribe con o sin acentos, te entiende igual.</small>
        </p>
      </div>
      <div class="col-12 col-sm-7 col-lg-4">
        <input id="search" class="form-control form-control-lg wc-search" placeholder="Buscar país… (ej. México, Japón)" aria-label="Buscar país">
      </div>
      <div class="col-12 col-sm-5 col-lg-2">
        <select id="sortBy" class="form-select form-select-lg wc-search" aria-label="Ordenar por">
          <option value="name">A-Z</option>
          <option value="confed">Confederación</option>
        </select>
      </div>
    </div>

    <div class="d-flex flex-wrap gap-2 mt-3">
      <button class="btn btn-sm wc-chip active" data-confed="ALL">Todas</button>
      <button class="btn btn-sm wc-chip" data-confed="CONCACAF">CONCACAF</button>
      <button class="btn btn-sm wc-chip" data-confed="CONMEBOL">CONMEBOL</button>
      <button class="btn btn-sm wc-chip" data-confed="UEFA">UEFA</button>
      <button class="btn btn-sm wc-chip" data-confed="AFC">AFC</button>
      <button class="btn btn-sm wc-chip" data-confed="CAF">CAF</button>
      <button class="btn btn-sm wc-chip" data-confed="OFC">OFC</button>

      <div class="form-check form-switch ms-auto">
        <input class="form-check-input" type="checkbox" role="switch" id="onlyQualified">
        <label class="form-check-label" for="onlyQualified">Solo clasificados</label>
      </div>
    </div>

    <div class="d-flex align-items-center gap-3 mt-3">
      <span id="resultCount" class="result-count small text-secondary"></span>
      <button id="clearBtn" class="btn btn-outline-secondary btn-sm d-none"><i class="bi bi-x-circle"></i> Limpiar búsqueda</button>
    </div>

    <div id="grid" class="row g-3 mt-1"></div>

    <div id="emptyMsg" class="text-center py-5 d-none">
      <i class="bi bi-emoji-neutral" style="font-size:2rem;"></i>
      <p class="mt-2 text-secondary mb-0">No encontramos coincidencias. Prueba con otro término o filtro.</p>
    </div>
  </main>

  <nav class="tabbar">
    <a href="index.html"><i class="bi bi-house-door" aria-hidden="true"></i><span>Inicio</span></a>
    <a href="ar.html"><i class="bi bi-camera" aria-hidden="true"></i><span>AR</span></a>
    <a href="trivias.html"><i class="bi bi-patch-question" aria-hidden="true"></i><span>Trivias</span></a>
    <a href="paises.html"><i class="bi bi-cube" aria-hidden="true"></i><span>Países</span></a>
    <a href="noticias.html"><i class="bi bi-newspaper" aria-hidden="true"></i><span>Noticias</span></a>
  </nav>

  <!-- Twemoji para que las banderas se vean SIEMPRE -->
  <script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js"></script>

  <script>
    // ——— Datos: los 13 que estás usando ———
    const COUNTRIES = [
      { id:"ar", name:"Argentina",      emoji:"🇦🇷", confed:"CONMEBOL", status:"Clasificado" },
      { id:"au", name:"Australia",      emoji:"🇦🇺", confed:"AFC",      status:"Clasificado" },
      { id:"br", name:"Brasil",         emoji:"🇧🇷", confed:"CONMEBOL", status:"Clasificado" },
      { id:"ca", name:"Canadá",         emoji:"🇨🇦", confed:"CONCACAF", status:"Anfitrión"   },
      { id:"kr", name:"Corea del Sur",  emoji:"🇰🇷", confed:"AFC",      status:"Clasificado" },
      { id:"ec", name:"Ecuador",        emoji:"🇪🇨", confed:"CONMEBOL", status:"Clasificado" },
      { id:"us", name:"Estados Unidos", emoji:"🇺🇸", confed:"CONCACAF", status:"Anfitrión"   },
      { id:"ir", name:"Irán",           emoji:"🇮🇷", confed:"AFC",      status:"Clasificado" },
      { id:"jp", name:"Japón",          emoji:"🇯🇵", confed:"AFC",      status:"Clasificado" },
      { id:"jo", name:"Jordania",       emoji:"🇯🇴", confed:"AFC",      status:"Clasificado" },
      { id:"mx", name:"México",         emoji:"🇲🇽", confed:"CONCACAF", status:"Anfitrión"   },
      { id:"nz", name:"Nueva Zelanda",  emoji:"🇳🇿", confed:"OFC",      status:"Clasificado" },
      { id:"uz", name:"Uzbekistán",     emoji:"🇺🇿", confed:"AFC",      status:"Clasificado" }
    ];

    const CONFED_CLASS = {
      "AFC":"c-afc", "CAF":"c-caf", "CONCACAF":"c-concacaf",
      "CONMEBOL":"c-conmebol", "UEFA":"c-uefa", "OFC":"c-ofc"
    };

    const grid   = document.getElementById('grid');
    const search = document.getElementById('search');
    const sortBy = document.getElementById('sortBy');
    const empty  = document.getElementById('emptyMsg');
    const resultCount = document.getElementById('resultCount');
    const clearBtn = document.getElementById('clearBtn');
    const confedChips = [...document.querySelectorAll('[data-confed]')];
    const onlyQualified = document.getElementById('onlyQualified');

    let state = { q:"", confed:"ALL", sort:"name", onlyQualified:false };

    // normaliza acentos para buscar "mexico" == "méxico"
    const norm = s => (s||"").toString().normalize('NFD').replace(/\p{Diacritic}/gu,'').toLowerCase();

    function badgeByStatus(status){
      if (status === 'Anfitrión')   return `<span class="badge badge-status badge-host">Anfitrión</span>`;
      if (status === 'Clasificado') return `<span class="badge badge-status badge-qualified">Clasificado</span>`;
      return `<span class="badge badge-status badge-pending">Pendiente</span>`;
    }

    // 🔧 render UNIFICADO (con <a href> + contador + vacío + Twemoji)
    function render(list){
      grid.innerHTML = '';
      empty.classList.toggle('d-none', list.length !== 0);
      resultCount.textContent = `${list.length} ${list.length===1 ? 'selección' : 'selecciones'} encontradas`;
      clearBtn.classList.toggle('d-none', !state.q);

      list.forEach(c => {
        const col = document.createElement('div');
        col.className = 'col-6 col-md-4 col-lg-3 col-xxl-2';
        col.innerHTML = `
          <a href="pais.html?id=${c.id}" class="text-reset text-decoration-none">
            <div class="card flag-card h-100 p-3">
              <div class="card-body d-flex flex-column align-items-center justify-content-center text-center p-0">
                <div class="flag-emoji" aria-hidden="true">${c.emoji}</div>
                <div class="flag-name mt-2">${c.name}</div>
                <div class="d-flex flex-wrap gap-2 justify-content-center mt-2">
                  <span class="badge badge-confed ${CONFED_CLASS[c.confed] || ''}">${c.confed}</span>
                  ${badgeByStatus(c.status)}
                </div>
              </div>
            </div>
          </a>`;
        grid.appendChild(col);
      });

      if (window.twemoji){ twemoji.parse(grid, { folder:'svg', ext:'.svg' }); }
    }

    function applyFilters(){
      let list = [...COUNTRIES];

      if (state.q){
        const nq = norm(state.q);
        list = list.filter(c => norm(c.name).includes(nq));
      }
      if (state.confed !== "ALL"){
        list = list.filter(c => c.confed === state.confed);
      }
      if (state.onlyQualified){
        list = list.filter(c => c.status === 'Clasificado' || c.status === 'Anfitrión');
      }
      list.sort((a,b)=>{
        if (state.sort === 'confed'){
          return (a.confed.localeCompare(b.confed)) || (a.name.localeCompare(b.name));
        }
        return a.name.localeCompare(b.name);
      });

      render(list);
    }

    // eventos
    search.addEventListener('input', e => { state.q = e.target.value; applyFilters(); });
    sortBy.addEventListener('change', e => { state.sort = e.target.value; applyFilters(); });
    confedChips.forEach(btn=>{
      btn.addEventListener('click', ()=>{
        confedChips.forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        state.confed = btn.dataset.confed;
        applyFilters();
      });
    });
    onlyQualified.addEventListener('change', e => { state.onlyQualified = e.target.checked; applyFilters(); });
    clearBtn.addEventListener('click', ()=>{ state.q=''; search.value=''; applyFilters(); search.focus(); });

    // init
    applyFilters();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
